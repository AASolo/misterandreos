<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Andreos</title>
<script src="https://telegram.org/js/telegram-web-app.js?64"></script>
<style>
  :root {
    --bg: var(--tg-theme-bg-color, #0f1115);
    --bg2: var(--tg-theme-secondary-bg-color, #181b22);
    --card: var(--tg-theme-section-bg-color, #1d212a);
    --text: var(--tg-theme-text-color, #f2f4f8);
    --hint: var(--tg-theme-hint-color, #8b93a5);
    --link: var(--tg-theme-link-color, #6ab3ff);
    --btn: var(--tg-theme-button-color, #3b82f6);
    --btn-text: var(--tg-theme-button-text-color, #ffffff);
    --accent: var(--tg-theme-accent-text-color, #6ab3ff);
    --sep: var(--tg-theme-section-separator-color, rgba(127,127,127,.18));
    --radius: 16px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg2); color: var(--text);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { padding: 0 0 calc(80px + env(safe-area-inset-bottom)); }
  header { padding: 20px 16px 8px; }
  header h1 { margin: 0; font-size: 24px; letter-spacing: -.3px; }
  header p { margin: 4px 0 0; color: var(--hint); }
  .tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 6px; padding: 10px 16px;
    background: var(--bg2); }
  .tab { flex: 1; border: 0; border-radius: 12px; padding: 10px 4px; font: inherit; font-weight: 600;
    background: var(--card); color: var(--text); cursor: pointer; transition: .15s; }
  .tab.active { background: var(--btn); color: var(--btn-text); }
  section { display: none; padding: 4px 16px 16px; animation: fade .2s ease; }
  section.active { display: block; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

  .games { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .game { position: relative; border-radius: var(--radius); padding: 16px 14px; min-height: 150px;
    display: flex; flex-direction: column; justify-content: space-between; color: #fff; cursor: pointer;
    overflow: hidden; box-shadow: 0 6px 18px rgba(0,0,0,.18); transition: transform .12s; }
  .game:active { transform: scale(.97); }
  .game .emoji { font-size: 34px; line-height: 1; margin-bottom: 12px; }
  .game h3 { margin: 0 0 4px; font-size: 16px; }
  .game p { margin: 0; font-size: 12.5px; opacity: .9; }
  .game .play { margin-top: 10px; align-self: flex-start; background: rgba(255,255,255,.22);
    padding: 5px 12px; border-radius: 99px; font-size: 13px; font-weight: 600; backdrop-filter: blur(6px); }
  .game.wide { grid-column: 1 / -1; min-height: 0; }

  .search { width: 100%; border: 0; border-radius: 12px; padding: 12px 14px; font: inherit;
    background: var(--card); color: var(--text); outline: none; margin-bottom: 12px; }
  .search::placeholder { color: var(--hint); }
  .group { background: var(--card); border-radius: var(--radius); margin-bottom: 10px; overflow: hidden; }
  .group > summary { list-style: none; padding: 14px 16px; font-weight: 600; cursor: pointer;
    display: flex; justify-content: space-between; align-items: center; }
  .group > summary::-webkit-details-marker { display: none; }
  .group > summary .count { color: var(--hint); font-weight: 400; font-size: 13px; }
  .item { padding: 12px 16px; border-top: 1px solid var(--sep); display: flex; gap: 12px; align-items: center; }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-size: 14.5px; }
  .item .desc { color: var(--hint); font-size: 12.5px; margin-top: 2px; }
  .item .price { color: var(--accent); font-weight: 600; font-size: 14px; margin-top: 4px; }
  .order-btn { border: 0; border-radius: 10px; padding: 8px 12px; font: inherit; font-size: 13px; font-weight: 600;
    background: var(--btn); color: var(--btn-text); cursor: pointer; white-space: nowrap; }
  .empty { color: var(--hint); text-align: center; padding: 24px 0; }
  .note { color: var(--hint); font-size: 12.5px; text-align: center; margin: 6px 0 0; }

  .form { background: var(--card); border-radius: var(--radius); padding: 16px; }
  .form label { display: block; font-size: 13px; color: var(--hint); margin: 12px 0 6px; }

  .form textarea { min-height: 110px; resize: vertical; }
  .form input:focus, .form textarea:focus { border-color: var(--btn); }
  .submit { width: 100%; margin-top: 16px; border: 0; border-radius: 12px; padding: 14px;
    font: inherit; font-weight: 700; background: var(--btn); color: var(--btn-text); cursor: pointer; }
  .contacts { display: flex; gap: 8px; margin-top: 12px; }

    padding: 12px 6px; border-radius: 12px; font-weight: 600; font-size: 13.5px; }
  .done { text-align: center; padding: 40px 16px; }

  #player .bar button { border: 0; background: var(--card); color: var(--text); border-radius: 10px;

  #player .bar span { flex: 1; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #player iframe { flex: 1; border: 0; width: 100%; background: #000; }
</style>
</head>

<div id="player">

  // Нечётную последнюю веб-игру растягиваем на всю ширину, чтобы не было дыры.
  const wide = apk || (webGames.length % 2 === 1 && g === webGames[webGames.length - 1]);
  return `<div class="game ${wide ? "wide" : ""}" data-i="${i}" style="background:linear-gradient(135deg,${GRADIENTS[i % GRADIENTS.length]})">
    <div class="emoji">${apk ? "📱" : EMOJI[i % EMOJI.length]}</div>
    <div><h3>${esc(g.title)}</h3><p>${esc(g.description)}</p></div>
    <div class="play">${apk ? "⬇️ Скачать для Android" : "▶ Играть"}</div></div>`;
}).join("");
document.querySelectorAll(".game").forEach(el => el.onclick = () => playGame(DATA.games[el.dataset.i]));

const player = document.getElementById("player"), frame = document.getElementById("gameFrame");
function playGame(g) {
  haptic("medium");
  if (g.url.endsWith(".apk")) { tg ? tg.openLink(g.url) : (location.href = g.url); return; }
  document.getElementById("gameTitle").textContent = g.title;
  frame.src = g.url;
  player.classList.add("open");
  if (tg) { tg.BackButton.show(); tg.disableVerticalSwipes && tg.disableVerticalSwipes(); }
}
function closeGame() {
  player.classList.remove("open");
  frame.src = "about:blank";
  if (tg) { tg.BackButton.hide(); tg.enableVerticalSwipes && tg.enableVerticalSwipes(); }
}
document.getElementById("closeGame").onclick = closeGame;
if (tg) tg.BackButton.onClick(closeGame);

// ---------- услуги ----------
function renderServices(query) {
  const q = query.trim().toLowerCase().replace(/ё/g, "е");
  const words = q.split(/\s+/).filter(Boolean);
  const match = (s) => words.every(w => s.toLowerCase().replace(/ё/g, "е").includes(w));
  const html = DATA.services.map(group => {
    const items = group.items.filter(it => !q || match(group.category + " " + it.name + " " + (it.description || "")));
    if (!items.length) return "";
    return `<details class="group" ${q ? "open" : ""}><summary>${esc(group.category)} <span class="count">${items.length}</span></summary>
      ${items.map(it => `<div class="item"><div class="info"><div class="name">${esc(it.name)}</div>
        ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ""}
        <div class="price">${esc(it.price)}</div></div>
        <button class="order-btn" data-name="${esc(it.name)}">Заказать</button></div>`).join("")}
    </details>`;
  }).join("");
  const list = document.getElementById("serviceList");
  list.innerHTML = html || `<div class="empty">Ничего не нашлось 🤔<br>Опишите задачу во вкладке «Заявка»</div>`;
  list.querySelectorAll(".order-btn").forEach(b => b.onclick = () => {
    haptic();
    document.getElementById("task").value = b.dataset.name + ". ";
    openTab("order");
    document.getElementById("task").focus();
  });
}
document.getElementById("search").oninput = (e) => renderServices(e.target.value);
renderServices("");

// ---------- заявка ----------
if (user) {
  document.getElementById("name").value = [user.first_name, user.last_name].filter(Boolean).join(" ");
  if (user.username) document.getElementById("contact").value = "@" + user.username;
}
document.getElementById("contactLinks").innerHTML =
  `<a href="${esc(DATA.contact_url)}" target="_blank">✍️ Написать в Telegram</a>` +
  `<a href="${esc(DATA.site_url)}" target="_blank">🌐 Сайт</a>`;
document.querySelectorAll("#contactLinks a").forEach(a => a.onclick = (e) => {
  if (!tg) return;
  e.preventDefault();
  a.href.startsWith("https://t.me/") ? tg.openTelegramLink(a.href) : tg.openLink(a.href);
});

function alertMsg(text) { tg && tg.showAlert ? tg.showAlert(text) : alert(text); }

document.getElementById("submitBtn").onclick = () => {
  const order = {
    type: "order",
    task: document.getElementById("task").value.trim(),
    name: document.getElementById("name").value.trim(),
    contact: document.getElementById("contact").value.trim(),
  };
  if (order.task.length < 3) { alertMsg("Опишите, пожалуйста, что нужно сделать 🙂"); return; }
  if (!order.contact) { alertMsg("Оставьте контакт, чтобы я мог ответить"); return; }
  haptic("medium");
  if (canSendData) {
    tg.sendData(JSON.stringify(order).slice(0, 4000));  // бот получит заявку, окно закроется само
    return;
  }
  // Открыто не кнопкой внизу чата: передаём заявку в бота через ссылку /start.
  if (botName) {
    const payload = "order";
    tg ? tg.openTelegramLink(`https://t.me/${botName}?start=${payload}`) : (location.href = `https://t.me/${botName}?start=${payload}`);
    alertMsg("Откроется чат с ботом: ответьте там на два вопроса, и заявка уйдёт Andreos.");
    return;
  }
  tg ? tg.openTelegramLink(DATA.contact_url) : (location.href = DATA.contact_url);
};

if (params.get("tab")) openTab(params.get("tab"));
</script>
</body>
</html>
